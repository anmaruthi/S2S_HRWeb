<div fxLayout="row" [style.width]="this.sessionService.getTotalScreenWidthInPx(this.Mode, this.FormColumnsWidth)">

  <div fxLayout="column" [style.width]="this.sessionService.FirstColumnWidthInPx(this.FormColumnsWidth)"
    *ngIf="Mode=='EDIT' || Mode=='ADD'" class="formColumn">

    <form novalidate #dialogForm="ngForm">

      <div fxLayout="row" class="actionBarRow">
        <div fxLayout="column" class="actionBarLabelColumnFull" fxLayoutAlign="center">
          <label *ngIf="Mode=='ADD'" class="menuBarHeading">Add Material Category</label>
          <label *ngIf="Mode=='EDIT'" class="menuBarHeading">Edit Material Category</label>
        </div>

        <div fxLayout="column" class="actionBarButtonColumn" fxLayoutAlign="center end">
          <div fxLayout="row" fxLayoutGap="20px">
            <div class="tooltip" matTooltip="Save" *ngIf="(this.sessionService.actionAllowed('ADD_ITEMCATEGORY') && this.Mode == 'ADD')
              || (this.sessionService.actionAllowed('EDIT_ITEMCATEGORY') && this.Mode == 'EDIT')"
              [matTooltipPosition]="this.sessionService.ToolTipPosition">
              <button type="submit" class="app-icon-button" (click)="submitClick(dialogForm.valid)">
                <i class="material-icons logout">save</i>
              </button>
            </div>
            <div class="tooltip" matTooltip="Cancel" [matTooltipPosition]="this.sessionService.ToolTipPosition">
              <button class="app-icon-button" (click)="cancelClick()">
                <i class="material-icons logout">cancel</i>
              </button>
            </div>
          </div>
        </div>
      </div>

      <div fxLayout="row" class="FirstColumnData">
        <div fxLayout="column" fxFlex=100%>
          <div fxLayout="row" fxLayoutAlign="center center">
            <div fxFlex=48%>
              <mat-form-field class="fld-mt0-w100">
                <input matInput type="text" maxlength="200" #ItemCategoryName="ngModel" name="ItemCategoryName"
                  [(ngModel)]="selectedDataGridItem.ItemCategoryName" placeholder="MaterialCategory Name" required>

                <mat-error *ngIf="this.submitAttempt && ItemCategoryName.hasError('required')">
                  Material Category Name is required
                </mat-error>
              </mat-form-field>
            </div>
            <div fxFlex="4%"></div>
            <div fxFlex=48%>
              <mat-form-field class="fld-mt0-w100">
                <mat-select required #Statuscode="ngModel" name="StatusCode"
                  [(ngModel)]="selectedDataGridItem.StatusCode" placeholder="Status">
                  <mat-option *ngFor="let itm of StatusList" [value]="itm.StatusCode">
                    {{ itm.StatusMessage }}
                  </mat-option>
                </mat-select>
                <mat-error *ngIf="this.submitAttempt && Statuscode.hasError('required')">
                  Status is required
                </mat-error>
              </mat-form-field>
            </div>
          </div>

        </div>


      </div>


    </form>

    <br>
    <br>


    <div fxLayout="row" fxLayoutAlign="center center">
      <p-table #dt1 [columns]="cols1" [value]="ItemCategoryTaxList" selectionMode="single" 
        [style.width]="this.sessionService.FirstColumnWidthInPx(this.FormColumnsWidth - 20)"
        [(selection)]="dialogItem" >

        <ng-template pTemplate="caption" class="capsegment">
          <form novalidate #dialogForm1="ngForm" *ngIf="this.Mode1 == 'ADD' || this.Mode1 == 'EDIT'">

            <div fxLayout="row" >
              <div fxLayout="column" fxFlex=100%>
                <div fxLayout="row" fxLayoutAlign="center center">
                  <div fxFlex=2%></div>
                  <div fxFlex=20%>
                    <autocomplete class="fld-mt0-w100" placeholder="Tax Code" required="true"
                      [submitAttempt]="this.submitAttempt1" [InputDataList]="this.TaxList" KeyID="TaxID"
                      KeyDescription="TaxCode" #TaxCode="ngModel" name="TaxCode" [(ngModel)]="selectedItemCategoryTax.TaxID"
                      (SelectionDone)="taxSelected($event)">
                    </autocomplete>
                  </div>
                  <div fxFlex=4%></div>
                  <div fxFlex=20%>
                    <mat-form-field class="fld-mt0-w100">
                      <input matInput type="number" maxlength="200" #TaxValue="ngModel" name="TaxValue"
                        [(ngModel)]="selectedItemCategoryTax.TaxValue" placeholder="Percentage" required>
      
                      <mat-error *ngIf="this.submitAttempt1 && TaxValue.hasError('required')">
                        Tax is required
                      </mat-error>
                    </mat-form-field>
                  </div>
                  <div fxFlex=4%></div>
                  <div fxFlex=24%>
                    <customdate class="fld-mt0-w100" placeholder="Effective From" required="true" #EffectiveDate="ngModel"
                      name="EffectiveDate" [(ngModel)]="selectedItemCategoryTax.EffectiveDateFrom" [allowFutureDate]="true"
                      [allowCurrentDate]="true" [allowPastDate]="true" [submitAttempt]="this.submitAttempt1"
                      [ReadOnlyControl]="false"> </customdate>
                  </div>
                  <div fxFlex=4%></div>
                  <div fxFlex=22%>
                    <div fxLayout="row" fxLayoutGap="20px" fxLayoutAlign="center end">
                      <div class="tooltip" matTooltip="Save" [matTooltipPosition]="this.sessionService.ToolTipPosition">
                        <button type="submit" class="app-icon-button" (click)="updateTaxDetails(dialogForm1.valid)">
                          <i class="material-icons logout">save</i>
                        </button>
                      </div>
                      <div class="tooltip" matTooltip="Cancel" [matTooltipPosition]="this.sessionService.ToolTipPosition">
                        <button class="app-icon-button" (click)="cancelTaxForm()">
                          <i class="material-icons logout">cancel</i>
                        </button>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>     
      
          </form>
            
        </ng-template>

        <ng-template pTemplate="header" let-columns>
          <tr>
            <th>
              <button class="app-icon-button" (click)="addtaxclick()">
                <i class="material-icons" color="accent">add_box</i>
              </button>
            </th>
            <th *ngFor="let col of columns" [pSortableColumn]="col.field" [style.width]="col.width">
              {{col.header}}
            </th>
            <th></th>
          </tr>
        </ng-template>

        <ng-template pTemplate="body" let-rwitem let-columns="columns">
          <tr [pSelectableRow]="rwitem">      
            <td>
              <button [disabled]="DisableEdit1()" class="app-icon-button" (click)="edittaxclick()">
                <i class="material-icons">edit</i>
              </button>
            </td>    
            <td pEditableColumn *ngFor="let col of columns" [style.width]="col.width" [style.text-align]="col.align"
              [style.word-wrap]="col.wrap">
              {{rwitem[col.field]}}
            </td>
            <td>
              <button [disabled]="DisableEdit1()" class="app-icon-button" (click)="deleteTaxDetail()">
                <i class="material-icons">delete</i>
              </button>
            </td>
          </tr>
        </ng-template>

        <ng-template pTemplate="emptymessage">
          No records found
        </ng-template>
      </p-table>
    </div>

  </div>

  <div class="ColumnDivider" *ngIf="Mode=='EDIT' || Mode=='ADD'"></div>

  <div fxLayout="column" [style.width]="this.sessionService.getScreenWidthInPx()">

    <div fxLayout="row">

      <div fxLayout="column">

        <div fxLayout="row" class="actionBarRow">

          <div fxLayout="column" class="actionBarLabelColumn" fxLayoutAlign="center">
            <label class="menuBarHeading">Material Category</label>
          </div>
          <div fxLayout="column" class="actionBarDataColumn">
          </div>
          <div fxLayout="column" class="actionBarSearchColumn">
           
          </div>

          <div fxLayout="column" fxLayoutGap="10px"></div>

          <div fxLayout="column" class="actionBarButtonColumn" fxLayoutAlign="center end">
            <div fxLayout="row" fxLayoutGap="17px">
              <div class="tooltip" matTooltip="Settings"
                *ngIf="this.sessionService.actionAllowed('SETTINGS_ITEMCATEGORY')"
                [matTooltipPosition]="this.sessionService.ToolTipPosition">
                <button [disabled]="DisableEdit()" class="app-icon-button" (click)="settingClick()">
                  <i class="material-icons">settings</i>
                </button>
              </div>
              <div class="tooltip" matTooltip="Add" *ngIf="this.sessionService.actionAllowed('ADD_ITEMCATEGORY')"
                [matTooltipPosition]="this.sessionService.ToolTipPosition">
                <button class="app-icon-button" (click)="addClick()">
                  <i class="material-icons">add_box</i>
                </button>
              </div>
              <div class="tooltip" matTooltip="Edit" *ngIf="this.sessionService.actionAllowed('EDIT_ITEMCATEGORY')"
                [matTooltipPosition]="this.sessionService.ToolTipPosition">
                <button [disabled]="DisableEdit()" class="app-icon-button" (click)="editClick()">
                  <i class="material-icons">edit</i>
                </button>
              </div>
              <div class="tooltip" matTooltip="Delete" *ngIf="this.sessionService.actionAllowed('DELETE_ITEMCATEGORY')"
                [matTooltipPosition]="this.sessionService.ToolTipPosition">
                <button [disabled]="DisableEdit()" class="app-icon-button" (click)="deleteClick()">
                  <i class="material-icons">delete</i>
                </button>
              </div>
              <div class="tooltip" matTooltip="Refresh" [matTooltipPosition]="this.sessionService.ToolTipPosition">
                <button class="app-icon-button" (click)="refreshClick()">
                  <i class="material-icons">refresh</i>
                </button>
              </div>
            </div>
          </div>
        </div>

        <div fxLayout="row" class="SecondColumnData">
          <p-table #dt [columns]="cols" [value]="dataGridList" selectionMode="single" [scrollable]="true"
            [scrollHeight]="this.sessionService.getDataTableScrollHeightInPX()"
            [style.width]="this.sessionService.getScreenWidthInPx()" [(selection)]="selectedData" [paginator]="true"
            [rows]="sessionService.NoOfRowsPerPage" [rowsPerPageOptions]="sessionService.RowsPerPageOptions">
            <ng-template pTemplate="header" let-columns>
              <tr>
                <th *ngFor="let col of columns" [pSortableColumn]="col.field" [style.width]="col.width">
                  {{col.header}}
                  <!-- <p-sortIcon [field]="col.field"></p-sortIcon> -->
                </th>
              </tr>
            </ng-template>
            <ng-template pTemplate="caption">
              <div fxLayout="column" fxLayoutAlign="center end">
                  <div class="flex">
                      <span class="p-input-icon-left ml-auto">
                          <span> <i class="pi pi-search"></i></span>
                          <input pInputText type="text"
                              (input)="dt.filterGlobal($event.target.value, 'contains')"
                              placeholder="Search here" />
                      </span>
                  </div>
              </div>
          </ng-template>
            <ng-template pTemplate="body" let-rowData let-columns="columns">
              <tr [pSelectableRow]="rowData" (dblclick)="onDoubleClick(rowData)">
                <td pEditableColumn *ngFor="let col of columns" [style.width]="col.width" [style.text-align]="col.align"
                  [style.word-wrap]="col.wrap">
                  {{rowData[col.field]}}
                </td>
              </tr>
            </ng-template>
            <ng-template pTemplate="emptymessage">
              No records found
            </ng-template>
          </p-table>
        </div>
      </div>
    </div>

  </div>

</div>
