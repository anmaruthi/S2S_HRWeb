<div fxLayout="row" [style.width]="this.sessionService.getTotalScreenWidthInPx(this.Mode, this.FormColumnsWidth)">

    <div fxLayout="column" [style.width]="this.sessionService.FirstColumnWidthInPx(this.FormColumnsWidth)" *ngIf="Mode=='EDIT' || Mode=='ADD'" class="formColumn">
    
        <form novalidate #dialogForm="ngForm">
            <div fxLayout="row" class="actionBarRow">
  
                    <div fxLayout="column" class="actionBarLabelColumnFull" fxLayoutAlign="center start">
                      <label *ngIf="Mode=='ADD'" class="menuBarHeading">Add Tax Master</label>
                      <label *ngIf="Mode=='EDIT'" class="menuBarHeading">Edit Tax Master</label>
                    </div>
    
                    <div fxLayout="column" class="actionBarButtonColumn" fxLayoutAlign="center end">
                        <div fxLayout="row" fxLayoutGap="20px">
                            <div class="tooltip" matTooltip="Save" *ngIf="(this.sessionService.actionAllowed('ADD_TAX') && this.Mode == 'ADD')
                                    || this.sessionService.actionAllowed('EDIT_TAX')" [matTooltipPosition]="this.sessionService.ToolTipPosition">
                                <button type="submit" class="app-icon-button" (click)="submitClick(dialogForm.valid)">
                                    <i class="material-icons logout">save</i>
                                </button>
                            </div>
                            <div class="tooltip" matTooltip="Cancel" [matTooltipPosition]="this.sessionService.ToolTipPosition">
                                <button class="app-icon-button" (click)="cancelClick()">
                                    <i class="material-icons logout">cancel</i>
                                </button>
                            </div>
                        </div>
                    </div>
            </div>
  
            <div fxLayout="row" class="FirstColumnData" [style.height]="this.sessionService.getFormDataScrollHeightInPX()">
                        
              <div fxLayout="column" fxFlex=100%>
                <br>
                <div fxLayout="row" fxLayoutAlign="center center">
                    <div fxFlex=60%>
                  <mat-form-field class="fld-mt0-w100">
                    <input matInput type="text" maxlength="100" #TaxCode="ngModel" name="TaxCode"
                           [(ngModel)]="selectedDataGridItem.TaxCode" placeholder="Tax Code" required>
                    <mat-error *ngIf="this.submitAttempt && TaxCode.hasError('required')">
                      Tax Code is required
                    </mat-error>
                  </mat-form-field>
                  </div>
                </div>

                <div fxLayout="row" fxLayoutAlign="center center">
                    <div fxFlex=60%>
                  <mat-form-field class="fld-mt0-w100">
                    <input matInput type="text" maxlength="100" #TaxName="ngModel" name="TaxName"
                           [(ngModel)]="selectedDataGridItem.TaxName" placeholder="Tax Name" required>
                    <mat-error *ngIf="this.submitAttempt && TaxName.hasError('required')">
                      Tax Name is required
                    </mat-error>
                  </mat-form-field>
                  </div>
                </div>

                <div fxLayout="row" fxLayoutAlign="center center">
                    <div fxFlex=60%>
                  <mat-form-field class="fld-mt0-w100">
                    <input matInput type="text" maxlength="100" #Description="ngModel" name="Description"
                           [(ngModel)]="selectedDataGridItem.Description" placeholder="Description" required>
                    <mat-error *ngIf="this.submitAttempt && Description.hasError('required')">
                      Tax Description is required
                    </mat-error>
                  </mat-form-field>
                  </div>
                </div>

                <br>

      
                <div fxLayout="row" fxLayoutAlign="center center">
                    <div fxFlex=60%  fxLayoutGap="127px">
                      <mat-checkbox #ApplyOtherState="ngModel" name="ApplyOtherState" 
                      [disableRipple]="true"
                      [(ngModel)]="this.selectedDataGridItem.ApplyOtherState"  
                                      *ngIf="this.Mode == 'ADD'"  >
                        OtherState
                      </mat-checkbox>
                   
                  
                      <mat-checkbox #ApplyInternational="ngModel" name="ApplyInternational"
                                    [disableRipple]="true"  
                                    [(ngModel)]="this.selectedDataGridItem.ApplyInternational"  *ngIf="this.Mode == 'ADD'">
                        International
                      </mat-checkbox>
                    </div>
                  </div>
                  <br>
                  <div fxLayout="row" fxLayoutAlign="center center">
                    <div fxFlex=60%  fxLayoutGap="127px">
                      <mat-checkbox #ApplyOtherState="ngModel" name="ApplyOtherState" 
                      [disableRipple]="true"
                      [(ngModel)]="this.selectedDataGridItem.ApplyOtherState"  
                                      *ngIf="this.Mode == 'EDIT'"  >
                        OtherState
                      </mat-checkbox>
                   
                  
                      <mat-checkbox #ApplyInternational="ngModel" name="ApplyInternational"
                                    [disableRipple]="true"  
                                    [(ngModel)]="this.selectedDataGridItem.ApplyInternational"  *ngIf="this.Mode == 'EDIT'">
                        International
                      </mat-checkbox>
                    </div>
                  </div>
                  <br>
<br>


                  
                <div fxLayout="row" fxLayoutAlign="center center">
                    <div fxFlex=60%>
                      <mat-form-field class="fld-mt0-w100">
                      <mat-select #StatusCode="ngModel" name="StatusCode" [(ngModel)]="selectedDataGridItem.StatusCode" required
                                  placeholder="Status">
                          <mat-option *ngFor="let itm of StatusList" [value]="itm.StatusCode">
                          {{ itm.StatusMessage }}
                          </mat-option>
                      </mat-select>
                      <mat-error *ngIf="this.submitAttempt && StatusCode.hasError('required')">
                          Status is required
                      </mat-error>
                      </mat-form-field>
                    </div>
                </div>
                <br>
                <br>
              </div>
            </div>
        </form>
    </div>
  
  
    <div class="ColumnDivider" *ngIf="Mode=='EDIT' || Mode=='ADD'"></div>
        
    <div fxLayout="column" [style.width]="this.sessionService.getScreenWidthInPx()" >
  
  
        <div fxLayout="row">
  
            <div fxLayout="column">
                
                <div fxLayout="row" class="actionBarRow" >
  
                    <div fxLayout="column" class="actionBarLabelColumn" fxLayoutAlign="center">
                            <label class="menuBarHeading">Tax Master</label>
                    </div>
                    <div fxLayout="column" class="actionBarDataColumn">
                        </div>
                    <div fxLayout="column" class="actionBarSearchColumn">
                           
                    </div>
                    <div fxLayout="column" class="actionBarButtonColumn" fxLayoutAlign="center end">
                            <div fxLayout="row" fxLayoutGap="20px">
                                <div class="tooltip" matTooltip="Add" *ngIf="this.sessionService.actionAllowed('ADD_TAX')" 
                                [matTooltipPosition]="this.sessionService.ToolTipPosition">
                                    <button class="app-icon-button" (click)="addClick()">
                                        <i class="material-icons">add_box</i>
                                    </button>
                                </div>
                                <div class="tooltip" matTooltip="Edit" *ngIf="this.sessionService.actionAllowed('EDIT_TAX')"
                                [matTooltipPosition]="this.sessionService.ToolTipPosition">
                                    <button [disabled]="!isRowSelected()" class="app-icon-button" (click)="editClick()">
                                        <i class="material-icons">edit</i>
                                    </button>
                                </div>
                                <div class="tooltip" matTooltip="Delete" *ngIf="this.sessionService.actionAllowed('DELETE_TAX')" 
                                [matTooltipPosition]="this.sessionService.ToolTipPosition">
                                    <button [disabled]="!isRowSelected()" class="app-icon-button" (click)="deleteClick()">
                                        <i class="material-icons">delete</i>
                                    </button>
                                </div>
                                <div class="tooltip" matTooltip="Refresh" [matTooltipPosition]="this.sessionService.ToolTipPosition">
                                    <button class="app-icon-button" (click)="refreshClick()">
                                      <i class="material-icons">refresh</i>
                                    </button>
                                </div>    
                            </div>
                    </div>
                </div>
                        
                <div fxLayout="row" class="SecondColumnData">
                    <p-table #dt [columns]="cols" [value]="dataGridList" selectionMode="single" [scrollable]="true" [scrollHeight]="this.sessionService.getDataTableScrollHeightInPX()" 
                    [style.width]="this.sessionService.getScreenWidthInPx()"
                    [(selection)]="selectedData" [paginator]="true" [rows]="sessionService.NoOfRowsPerPage" 
                    [rowsPerPageOptions]="sessionService.RowsPerPageOptions">    
                        <ng-template pTemplate="header" let-columns>
                            <tr> 
                                <th *ngFor="let col of columns"  [pSortableColumn]="col.field" [style.width]="col.width">
                                    {{col.header}}
                                    <!-- <p-sortIcon [field]="col.field"></p-sortIcon> -->
                                </th>
                            </tr>
                        </ng-template>
                        <ng-template pTemplate="caption">
                          <div fxLayout="column" fxLayoutAlign="center end">
                              <div class="flex">
                                  <span class="p-input-icon-left ml-auto">
                                      <span> <i class="pi pi-search"></i></span>
                                      <input pInputText type="text"
                                          (input)="dt.filterGlobal($event.target.value, 'contains')"
                                          placeholder="Search here" />
                                  </span>
                              </div>
                          </div>
                      </ng-template>
                        <ng-template pTemplate="body" let-rowData let-columns="columns">
                            <tr [pSelectableRow]="rowData" (dblclick)="onDoubleClick(rowData)">
                                <td pEditableColumn *ngFor="let col of columns" [style.width]="col.width" [style.text-align]="col.align"
                                    [style.word-wrap]="col.wrap">
                                    {{rowData[col.field]}}
                                </td>
                            </tr>
                        </ng-template>
                        <ng-template pTemplate="emptymessage">
                            No records found
                        </ng-template>
                    </p-table>
                </div>
            </div>  
        </div>
  
    </div>
  
  </div>
