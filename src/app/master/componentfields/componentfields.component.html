
<div fxLayout="row" [style.width]="this.sessionService.getTotalScreenWidthInPx(this.Mode, this.FormColumnsWidth)">

  <div fxLayout="column" [style.width]="this.sessionService.FirstColumnWidthInPx(this.FormColumnsWidth)" *ngIf="Mode=='EDIT' || Mode=='ADD'" class="formColumn">
      <form novalidate #dialogForm="ngForm">
          <div fxLayout="row" class="actionBarRow">
              <div fxLayout="column" class="actionBarLabelColumnFull" fxLayoutAlign="center">
                <label *ngIf="Mode=='ADD'" class="menuBarHeading">Add Field</label>
                <label *ngIf="Mode=='EDIT'" class="menuBarHeading">Edit Field</label>
              </div>
      
              <div fxLayout="column" class="actionBarButtonColumn" fxLayoutAlign="center end">
                <div fxLayout="row" fxLayoutGap="20px">
                  <div class="tooltip" matTooltip="Save"  *ngIf="(this.sessionService.actionAllowed('ADD_COMPONENTFIELDS') && this.Mode == 'ADD')
                  || this.sessionService.actionAllowed('EDIT_COMPONENTFIELDS')" [matTooltipPosition]="this.sessionService.ToolTipPosition">
                    <button type="submit" class="app-icon-button" (click)="SubmitClick(dialogForm.valid)">
                      <i class="material-icons logout">save</i>
                    </button>
                  </div>
                  <div class="tooltip" matTooltip="Cancel" [matTooltipPosition]="this.sessionService.ToolTipPosition">
                    <button class="app-icon-button" (click)="cancelClick()">
                      <i class="material-icons logout">cancel</i>
                    </button>
                  </div>
                </div>
              </div>
            </div>

          <div fxLayout="row" class="FirstColumnData" [style.height]="this.sessionService.getFormDataScrollHeightInPX()">
                      
              <div fxLayout="column" fxFlex=100%>
                  <div fxLayout="row" fxLayoutAlign="center center">
                    <div fxFlex=60%>
                      <mat-form-field class="fld-mt0-w100">
                        <input matInput type="text" maxlength="50" #FieldName="ngModel" name="FieldName"
                             [(ngModel)]="selectedDataGridItem.FieldName" placeholder="Field Name" required>
                        <mat-error *ngIf="this.submitAttempt && FieldName.hasError('required')">
                          Field Name is required
                        </mat-error>
                      </mat-form-field>
                    </div>
                  </div>
        
                  <div fxLayout="row" fxLayoutAlign="center center">
                    <div fxFlex=60%>
                      <mat-form-field class="fld-mt0-w100">
                        <textarea matInput maxlength="50" #FieldDescription="ngModel" name="FieldDescription"
                               [(ngModel)]="selectedDataGridItem.FieldDescription" placeholder="Field Description" required>
                        </textarea>
                        <mat-error *ngIf="this.submitAttempt && FieldDescription.hasError('required')">
                            Field Description is required
                        </mat-error>
                      </mat-form-field>
                    </div>
                  </div>
        
                  <div fxLayout="row" fxLayoutAlign="center center">
                    <div fxFlex=60%>
                      <mat-form-field class="fld-mt0-w100">
                          <input matInput type="number" #sortOrder="ngModel" name="sortOrder" [(ngModel)]="selectedDataGridItem.SortOrder"  required
                          placeholder="Sort Order"/>
                          <mat-error *ngIf="this.submitAttempt && sortOrder.hasError('required')">
                              Sort Order is Required
                          </mat-error>
                      </mat-form-field>
                    </div>
                  </div>      
        
                  <div fxLayout="row" style="margin-top:10px" fxLayoutAlign="center center">
                    <div  fxFlex="60%">
                      <mat-form-field class="fld-mt0-w100">
                        <mat-select #TypeID="ngModel" name="TypeID" [(ngModel)]="selectedDataGridItem.TypeIDs" 
                                  placeholder="Component Types" multiple>
                          <mat-option *ngFor="let itm of ComponentTypeList" [value]="itm.LookupID">
                            {{ itm.Description }}
                          </mat-option>
                        </mat-select>   
                      </mat-form-field>                  
                    </div>
                  </div>

                  <div fxLayout="row" style="margin-top:10px" fxLayoutAlign="center center">
                      <div  fxFlex="60%">
                          <mat-checkbox #isDefault="ngModel" name="isDefault" [(ngModel)]="selectedDataGridItem.IsDefault">Is Default</mat-checkbox>              
                      </div>                
                  </div>

                          
                  <div fxLayout="row" style="margin-top:10px" fxLayoutAlign="center center">
                    <div  fxFlex="60%">
                      <mat-form-field class="fld-mt0-w100">
                        <mat-select #FieldTypeID1="ngModel" name="FieldTypeID1" [(ngModel)]="selectedDataGridItem.FieldTypeID" 
                                  placeholder="Field Type">
                          <mat-option *ngFor="let itm of ComponentFieldTypeList" [value]="itm.FieldTypeID">
                            {{ itm.FieldTypeName }}
                          </mat-option>
                        </mat-select>   
                      </mat-form-field>                  
                    </div>
                  </div>

                  <div fxLayout="row" fxLayoutAlign="center center">
                    <div fxFlex=60%>
                      <mat-form-field class="fld-mt0-w100">
                          <input matInput type="text" #fldValues="ngModel" name="fldValues" [(ngModel)]="selectedDataGridItem.FieldTypeValues"  
                          placeholder="Field Type Values"/>
                           
                      </mat-form-field>
                    </div>
                  </div>   
                  
                  <div fxLayout="row" style="margin-top:10px" fxLayoutAlign="center center">
                    <div fxFlex=60%>
                      <mat-form-field class="fld-mt0-w100">
                        <mat-select #StatusCode="ngModel" name="StatusCode" [(ngModel)]="selectedDataGridItem.StatusCode" required
                                  placeholder="Status">
                          <mat-option *ngFor="let itm of StatusList" [value]="itm.StatusCode">
                            {{ itm.StatusMessage }}
                          </mat-option>
                        </mat-select>
                        <mat-error *ngIf="this.submitAttempt && StatusCode.hasError('required')">
                          Status is required
                        </mat-error>
                      </mat-form-field>
                    </div>
                  </div>
                  <br>
                  <br>
              </div> 
          </div>
      </form>
  </div>

  <div class="ColumnDivider" *ngIf="Mode=='EDIT' || Mode=='ADD'"></div>
      
  <div fxLayout="column" [style.width]="this.sessionService.getScreenWidthInPx()" >


      <div fxLayout="row">

          <div fxLayout="column">
              
              <div fxLayout="row" class="actionBarRow" >

                  <div fxLayout="column" class="actionBarLabelColumn" fxLayoutAlign="center">
                          <label class="menuBarHeading">Component Fields</label>
                  </div>
                  <div fxLayout="column" class="actionBarDataColumn">
                      </div>
                  <div fxLayout="column" class="actionBarSearchColumn">
                          <mat-form-field>
                              <input inputmode="search" (keyup)="onKeyUp()" (input)="dt.filterGlobal($event.target.value, 'contains')" matInput placeholder="Text Filter" class="searchBox">
                          </mat-form-field>
                  </div>
                  <div fxLayout="column" class="actionBarButtonColumn" fxLayoutAlign="center end">
                          <div fxLayout="row" fxLayoutGap="20px">
                              <div class="tooltip" matTooltip="Add" *ngIf="this.sessionService.actionAllowed('ADD_COLOR')" 
                              [matTooltipPosition]="this.sessionService.ToolTipPosition">
                                  <button class="app-icon-button" (click)="addClick()">
                                      <i class="material-icons">add_box</i>
                                  </button>
                              </div>
                              <div class="tooltip" matTooltip="Edit" *ngIf="this.sessionService.actionAllowed('EDIT_COLOR')"
                              [matTooltipPosition]="this.sessionService.ToolTipPosition">
                                  <button [disabled]="!isRowSelected()" class="app-icon-button" (click)="editClick()">
                                      <i class="material-icons">edit</i>
                                  </button>
                              </div>
                              <div class="tooltip" matTooltip="Delete" *ngIf="this.sessionService.actionAllowed('DELETE_COLOR')" 
                              [matTooltipPosition]="this.sessionService.ToolTipPosition">
                                  <button [disabled]="!isRowSelected()" class="app-icon-button" (click)="deleteClick()">
                                      <i class="material-icons">delete</i>
                                  </button>
                              </div>
                              <div class="tooltip" matTooltip="Refresh" [matTooltipPosition]="this.sessionService.ToolTipPosition">
                                  <button class="app-icon-button" (click)="refreshClick()">
                                    <i class="material-icons">refresh</i>
                                  </button>
                              </div>    
                          </div>
                  </div>
              </div>
                      
              <div fxLayout="row" class="SecondColumnData">
                  <p-table #dt [columns]="cols" [value]="dataGridList" selectionMode="single" [scrollable]="true" [scrollHeight]="this.sessionService.getDataTableScrollHeightInPX()" 
                  [style.width]="this.sessionService.getScreenWidthInPx()"
                  [(selection)]="selectedData" [paginator]="true" [rows]="sessionService.NoOfRowsPerPage" 
                  [rowsPerPageOptions]="sessionService.RowsPerPageOptions">    
                      <ng-template pTemplate="header" let-columns>
                          <tr> 
                              <th *ngFor="let col of columns"  [pSortableColumn]="col.field" [style.width]="col.width">
                                  {{col.header}}
                                  <p-sortIcon [field]="col.field"></p-sortIcon>
                              </th>
                          </tr>
                      </ng-template>
                      <ng-template pTemplate="body" let-rowData let-columns="columns">
                          <tr [pSelectableRow]="rowData" (dblclick)="onDoubleClick(rowData)">
                              <td pEditableColumn *ngFor="let col of columns" [style.width]="col.width" [style.text-align]="col.align"
                                  [style.word-wrap]="col.wrap">
                                  {{rowData[col.field]}}
                              </td>
                          </tr>
                      </ng-template>
                      <ng-template pTemplate="emptymessage">
                          No records found
                      </ng-template>
                  </p-table>
              </div>
          </div>  
      </div> 
  </div>
</div>
