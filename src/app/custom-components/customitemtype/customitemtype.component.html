<style>
    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button {
        -webkit-appearance: none;
    }
</style>

 
<div>
    <form novalidate #dialogForm="ngForm">
            <div fxLayout="row" class="actionBarRow">

                    <div fxLayout="column" class="actionBarLabelColumnFull" fxLayoutAlign="center start">
                        <label *ngIf="Mode=='ADD'" class="menuBarHeading">Add Item Type Master</label>
                        <label *ngIf="Mode=='EDIT'" class="menuBarHeading">Edit Item Type Master</label>
                    </div>
    
                    <div fxLayout="column" class="actionBarButtonColumn" fxLayoutAlign="center end">
                        <div fxLayout="row" fxLayoutGap="20px">
                            <div class="tooltip" matTooltip="Save" *ngIf="(this.sessionService.actionAllowed('ADD_ITEMTYPE') && this.Mode == 'ADD')
                                    || this.sessionService.actionAllowed('EDIT_ITEMTYPE')" [matTooltipPosition]="this.sessionService.ToolTipPosition">
                                <button type="submit" class="app-icon-button" (click)="SubmitClick(dialogForm.valid)">
                                    <i class="material-icons logout">save</i>
                                </button>
                            </div>
                            <div class="tooltip" matTooltip="Cancel" [matTooltipPosition]="this.sessionService.ToolTipPosition">
                                <button class="app-icon-button" (click)="cancelClick()">
                                    <i class="material-icons logout">cancel</i>
                                </button>
                            </div>
                        </div>
                    </div>

            </div>

            <div fxLayout="row" class="FirstColumnData" [style.height]="this.sessionService.getFormDataScrollHeightInPX()">
                        
                <div fxLayout="column" fxFlex=100%>
                    <br>

                    <div fxLayout="row" fxLayoutAlign="center center">
                        <div fxFlex=80%>
                            <mat-form-field class="fld-mt0-w100">
                                <input matInput type="text" maxlength="100" #ItemTypeName="ngModel" name="ItemTypeName"
                                        [(ngModel)]="selectedDataGridItem.ItemTypeName" placeholder="Item Type" required>
                                <mat-error *ngIf="this.submitAttempt && ItemTypeName.hasError('required')">
                                    Item Type is required
                                </mat-error> 
                            </mat-form-field>
                        </div>
                    </div>

                    <div fxLayout="row" fxLayoutAlign="center center">
                        <div fxFlex=80%>
                            <mat-form-field class="fld-mt0-w100">
                                <mat-select #ItemCategoryID="ngModel" name="ItemCategoryID"  [(ngModel)]="selectedDataGridItem.ItemCategoryID" required
                                    placeholder="Item Category">
                                    <mat-option *ngFor="let itm of categoryList" [value]="itm.ItemCategoryID">
                                        {{ itm.ItemCategoryName }}
                                    </mat-option>
                                </mat-select>
                                <mat-error *ngIf="this.submitAttempt && ItemCategoryID.hasError('required')">
                                    Item Category is required
                                </mat-error>
                            </mat-form-field>
                      </div>
                    </div>
              

                    <div fxLayout="row" fxLayoutAlign="center center">
                        <div fxFlex=80%>
                          <mat-form-field class="fld-mt0-w100">
                            <mat-select #StatusCode="ngModel" name="StatusCode" [(ngModel)]="selectedDataGridItem.StatusCode" required
                                        placeholder="Status">
                                <mat-option *ngFor="let itm of StatusList" [value]="itm.StatusCode">
                                {{ itm.StatusMessage }}
                                </mat-option>
                            </mat-select>
                            <mat-error *ngIf="this.submitAttempt && StatusCode.hasError('required')">
                                Status is required
                            </mat-error>
                          </mat-form-field>
                        </div>
                    </div>

                    <br>
                    <br>
                </div>


            </div>
    </form>
</div>
