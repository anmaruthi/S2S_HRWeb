<div fxLayout="row" [style.width]="this.sessionService.getTotalScreenWidthInPx(this.Mode, this.FormColumnsWidth)">

    <div fxLayout="column" [style.width]="this.sessionService.FirstColumnWidthInPx(this.FormColumnsWidth)"
        *ngIf="Mode=='EDIT' || Mode=='ADD'" class="formColumn">

        <form novalidate #dialogForm="ngForm">
            <div fxLayout="row" class="actionBarRow">
                <div fxLayout="column" class="actionBarLabelColumnFull" fxLayoutAlign="center start">
                    <label *ngIf="Mode=='ADD'" class="menuBarHeading">Add Finger / Face Devices</label>
                    <label *ngIf="Mode=='EDIT'" class="menuBarHeading">Edit Finger / Face Devices</label>
                </div>

                <div fxLayout="column" class="actionBarButtonColumn" fxLayoutAlign="center end">
                    <div fxLayout="row" fxLayoutGap="20px">
                        <div class="tooltip" matTooltip="Save" *ngIf="(this.sessionService.actionAllowed('ADD_ITEMTYPE') && this.Mode == 'ADD')
                            || this.sessionService.actionAllowed('EDIT_ITEMTYPE')"
                            [matTooltipPosition]="this.sessionService.ToolTipPosition">
                            <button type="submit" class="app-icon-button" (click)="submitClick(dialogForm.valid)">
                                <i class="material-icons logout">save</i>
                            </button>
                        </div>
                        <div class="tooltip" matTooltip="Cancel"
                            [matTooltipPosition]="this.sessionService.ToolTipPosition">
                            <button class="app-icon-button" (click)="cancelClick()">
                                <i class="material-icons logout">cancel</i>
                            </button>
                        </div>
                    </div>
                </div>

            </div>
            <div fxLayout="row" class="FirstColumnData"
                [style.height]="this.sessionService.getFormDataScrollHeightInPX()">
                <div fxLayout="column" fxFlex=100%>
                    <br>
                    <div fxLayout="row" fxLayoutAlign="center center">
                        <div fxFlex=35%>

                            <mat-form-field class="fld-mt0-w100">
                                <input matInput type="text" maxlength="100" #FPDeviceName="ngModel" name="FPDeviceName"
                                    [(ngModel)]="selectedDataGridItem.FPDeviceName" placeholder="Device Name" required>
                                <mat-error *ngIf="this.submitAttempt && FPDeviceName.hasError('required')">
                                    Device Name is required
                                </mat-error>
                            </mat-form-field>

                        </div>
                        <div fxFlex=4%></div>
                        <div fxFlex=40%>
                            <mat-form-field class="fld-mt0-w100">
                                <input matInput type="text" maxlength="100" #FPDeviceIP="ngModel" name=" #FPDeviceIP"
                                    [(ngModel)]="selectedDataGridItem.FPDeviceIP" placeholder="IP Address" required>
                                <mat-error *ngIf="this.submitAttempt && FPDeviceIP.hasError('required')">
                                    IP Address is required
                                </mat-error>
                            </mat-form-field>
                        </div>
                    </div>

                    <div fxLayout="row" fxLayoutAlign="center center">
                        <div fxFlex=15%>
                            <mat-form-field class="fld-mt0-w100">
                                <input matInput type="text" maxlength="100" #FPDevicePort="ngModel" name="FPDevicePort"
                                    [(ngModel)]="selectedDataGridItem.FPDevicePort" placeholder="Port" required>
                                <mat-error *ngIf="this.submitAttempt && FPDevicePort.hasError('required')">
                                    Port is required
                                </mat-error>
                            </mat-form-field>
                        </div>
                        <div fxFlex=5%></div>
                        <div fxFlex=15%>
                            <mat-form-field class="fld-mt0-w100">
                                <mat-select #FPDeviceType="ngModel" name="#FPDeviceType"
                                    [(ngModel)]="selectedDataGridItem.FPDeviceType" required placeholder="Access type ">
                                    <mat-option *ngFor="let itm of AccessTypeList" [value]="itm.AccessTypeName">
                                        {{ itm.AccessTypeName}}
                                    </mat-option>
                                </mat-select>
                                <mat-error *ngIf="this.submitAttempt && FPDeviceName.hasError('required')">
                                    Access type is required
                                </mat-error>
                            </mat-form-field>
                        </div>
                        <div fxFlex=4%></div>
                        <div fxFlex=40%>
                            <mat-form-field class="fld-mt0-w100">
                                <mat-select #StatusMessage="ngModel" name="StatusMessage"
                                    [(ngModel)]="selectedDataGridItem.StatusMessage" required placeholder="Status">
                                    <mat-option *ngFor="let itm of StatusList" [value]="itm.StatusMessage">
                                        {{ itm.StatusMessage }}
                                    </mat-option>
                                </mat-select>
                                <mat-error *ngIf="this.submitAttempt && StatusMessage.hasError('required')">
                                    Status is required
                                </mat-error>
                            </mat-form-field>
                        </div>
                    </div>

                    <!-- <div fxLayout="row" >
                            <div fxFlex=60%>
                                <mat-form-field class="fld-mt0-w100">
                                    <input matInput type="text" maxlength="100" #FPDeviceType="ngModel" name="FPDeviceType" [(ngModel)]="selectedDataGridItem.FPDeviceType"
                                        placeholder="Access Type" required>
                                    <mat-error *ngIf="this.submitAttempt && FPDeviceType.hasError('required')">
                                            Access Type is required
                                    </mat-error>
                                </mat-form-field>
                            </div>
                        </div> -->

                    <!-- <mat-error *ngIf="this.submitAttempt && FPDeviceNote.hasError('required')">
                                    Device Note is required
                                </mat-error> -->

                    <!-- <div fxLayout="row">
                        <div fxFlex=60%>
                            <mat-form-field class="fld-mt0-w100">
                                <input matInput type="text" maxlength="100" #StatusMessage="ngModel" name="StatusMessage" [(ngModel)]="selectedDataGridItem.StatusMessage"
                                    placeholder="Device Status" required>
                                <mat-error *ngIf="this.submitAttempt && StatusMessage.hasError('required')">
                                    Device Status is required
                                </mat-error>
                            </mat-form-field>
                        </div>
                    </div> -->

                    <div fxLayout="row" fxLayoutAlign="center center">
                        <div fxFlex=79%>
                            <mat-form-field class="fld-mt0-w100">
                                <input matInput type="text" maxlength="100" #FPDeviceNote="ngModel" name="FPDeviceNote"
                                    [(ngModel)]="selectedDataGridItem.FPDeviceNote" placeholder="Device Note">
                            </mat-form-field>
                        </div>
                    </div>
                </div>
            </div>
        </form>
    </div>

    <div class="ColumnDivider" *ngIf="Mode=='EDIT' || Mode=='ADD'"></div>

    <div fxLayout="column" [style.width]="this.sessionService.getScreenWidthInPx()">
        <div fxLayout="row">
            <div fxLayout="column">
                <div fxLayout="row" class="actionBarRow">
                    <div fxLayout="column" class="actionBarLabelColumn" fxLayoutAlign="center">
                        <label class="menuBarHeading">Finger / Face Devices</label>
                    </div>

                    <div fxLayout="column" class="actionBarDataColumn">
                    </div>

                    <div fxLayout="column" class="actionBarSearchColumn">
                    </div>

                    <div fxLayout="column" fxLayoutGap="10px">
                    </div>

                    <div fxLayout="column" class="actionBarButtonColumn" fxLayoutAlign="center end">
                        <div fxLayout="row" fxLayoutGap="17px">
                            <div class="tooltip" matTooltip="Add"
                                *ngIf="this.sessionService.actionAllowed('ADD_FP DEVICES')"
                                [matTooltipPosition]="this.sessionService.ToolTipPosition">
                                <button class="app-icon-button" (click)="addClick()">
                                    <i class="material-icons">add_box</i>
                                </button>
                            </div>
                            <div class="tooltip" matTooltip="Edit"
                                *ngIf="this.sessionService.actionAllowed('EDIT_FP DEVICES')"
                                [matTooltipPosition]="this.sessionService.ToolTipPosition">
                                <button [disabled]="DisableEdit()" class="app-icon-button" (click)="editClick()">
                                    <i class="material-icons">edit</i>
                                </button>
                            </div>
                            <div class="tooltip" matTooltip="Delete"
                                *ngIf="this.sessionService.actionAllowed('DELETE_FP DEVICES')"
                                [matTooltipPosition]="this.sessionService.ToolTipPosition">
                                <button [disabled]="DisableEdit()" class="app-icon-button" (click)="deleteClick()">
                                    <i class="material-icons">delete</i>
                                </button>
                            </div>
                            <div class="tooltip" matTooltip="Refresh"
                                [matTooltipPosition]="this.sessionService.ToolTipPosition">
                                <button class="app-icon-button" (click)="refreshClick()">
                                    <i class="material-icons">refresh</i>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <div fxLayout="row" class="SecondColumnData">

                    <p-table #dt [columns]="cols" [value]="dataGridList" selectionMode="single" [scrollable]="true"
                        [scrollHeight]="this.sessionService.getDataTableScrollHeightInPX()"
                        [style.width]="this.sessionService.getScreenWidthInPx()"
                        [globalFilterFields]="['FPDeviceID','FPDeviceName','FPDeviceIP','FPDevicePort','FPDeviceType','FPDeviceNote','StatusMessage']"
                        [(selection)]="selectedData" [paginator]="true" [rows]="sessionService.NoOfRowsPerPage"
                        [rowsPerPageOptions]="sessionService.RowsPerPageOptions">
                        <ng-template class="globalFilterFields" pTemplate="header" let-columns>
                            <tr>
                                <th *ngFor="let col of columns" [pSortableColumn]="col.field" [style.width]="col.width">
                                    {{col.header}}

                                    <p-sortIcon [field]="col.field"></p-sortIcon>
                                </th>
                            </tr>
                        </ng-template>

                        <ng-template pTemplate="caption">
                            <div fxLayout="column" fxLayoutAlign="center end">
                                <div class="flex">
                                    <span class="p-input-icon-left ml-auto">
                                        <span> <i class="pi pi-search"></i></span>
                                        <input pInputText type="text"
                                            (input)="dt.filterGlobal($event.target.value, 'contains')"
                                            placeholder="Search here" />
                                    </span>
                                </div>
                            </div>
                        </ng-template>

                        <ng-template pTemplate="body" let-rowData let-columns="columns">
                            <tr [pSelectableRow]="rowData" (dblclick)="onDoubleClick(rowData)">
                                <td pEditableColumn *ngFor="let col of columns" [style.width]="col.width"
                                    [style.text-align]="col.align" [style.word-wrap]="col.wrap">
                                    {{rowData[col.field]}}
                                </td>
                            </tr>
                        </ng-template>

                        <ng-template pTemplate="emptymessage">
                            No records found
                        </ng-template>
                    </p-table>
                </div>
            </div>
        </div>
    </div>
</div>
