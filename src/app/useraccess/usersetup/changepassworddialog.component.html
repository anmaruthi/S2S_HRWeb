<div class="dialogContainer">
  
<h3 mat-dialog-title class="mdDialogHeader" align="center">{{this.DialogHeader}}</h3>

<form novalidate [formGroup]="formGroup" (ngSubmit)="submitClick()">

  <div fxLayout="row">

    <div fxFlex=100% fxLayoutAlign="center center">
      <mat-form-field fxFlex=75%>
        <input matInput type="password" formControlName="CurrentPassword" placeholder="Current Password" required/>
        <mat-error *ngIf="!this.formGroup.controls.CurrentPassword.valid && this.submitAttempt &&
              this.formGroup.controls.CurrentPassword.errors.required">
              Current Password is required
        </mat-error>
      </mat-form-field>
    </div>
  </div>

  <div fxLayout="row">
    <div fxFlex=100% fxLayoutAlign="center center">
      <mat-form-field fxFlex=75%>
        <input matInput type="password" formControlName="NewPassword" placeholder="New Password" required/>
        <mat-error *ngIf="!this.formGroup.controls.NewPassword.valid && this.submitAttempt &&
              this.formGroup.controls.NewPassword.errors.required">
              New Password is required
        </mat-error>
      </mat-form-field>
    </div>
  </div>

  <div fxLayout="row">
    <div fxFlex=100% fxLayoutAlign="center center">
      <mat-form-field fxFlex=75%>
        <input matInput type="password" formControlName="ConfirmPassword" placeholder="Confirm Password" required/>
        <mat-error *ngIf="!this.formGroup.controls.ConfirmPassword.valid && this.submitAttempt &&
              this.formGroup.controls.ConfirmPassword.errors.required">
              Confirm Password is required
        </mat-error>
      </mat-form-field>
    </div>
  </div>
  <div  fxLayout="row" fxLayoutAlign="center center" *ngIf="this.isPinMismatch" class="formError">
            Password Mismatch 
  </div>
  <br>
  <br>
 <br>
  
    <div fxLayout="row" fxLayoutGap="10px" fxLayoutAlign="center center">
        <button type="submit" color="primary" mat-raised-button>Submit</button>
      <button type="button" color="primary" mat-raised-button (click)="cancelClick()">Cancel</button>
    </div>

</form>

</div>
